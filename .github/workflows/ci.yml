name: MotoFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend (Go) Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: motoflow-backend/go.sum

      - name: Verify Dependencies
        run: |
          cd motoflow-backend
          go mod verify

      - name: Run Go Vet
        run: |
          cd motoflow-backend
          go vet ./...

      - name: Run Unit Tests with Race Detector
        run: |
          cd motoflow-backend
          go test -v -race ./...

      - name: Build Backend Binary
        run: |
          cd motoflow-backend
          CGO_ENABLED=0 go build -ldflags="-w -s" -o motoflow-server .

  frontend-build:
    name: Frontend (Vue 3) Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: motoflow-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd motoflow-frontend
          npm ci

      - name: Type Check and Production Build
        run: |
          cd motoflow-frontend
          npm run build

